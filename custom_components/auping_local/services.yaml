move_to:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: auping_local
    side:
      required: true
      default: both
      selector:
        select:
          translation_key: side
          options: ["both", "a", "b"]
    motor:
      required: true
      selector:
        select:
          translation_key: motor
          options: ["head", "back", "lower_back", "legs", "feet"]
    position:
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
move:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: auping_local
    side:
      required: true
      selector:
        select:
          translation_key: side
          options: ["both", "a", "b"]
    motor:
      required: true
      selector:
        select:
          translation_key: motor
          options: ["head", "back", "lower_back", "legs", "feet"]
    direction:
      required: true
      selector:
        select:
          translation_key: direction
          options: ["up", "down"]
    duration:
      required: true
      selector:
        number:
          min: 50
          max: 60000
          unit_of_measurement: ms
stop:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: auping_local
flat:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: auping_local
home:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: auping_local
goto_favorite:
  fields:
